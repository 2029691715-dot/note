<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8" />

  <title>拾遗录</title>
  <meta name="description" content="个人博客：学习笔记、技术教程与生活随笔。" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%232e5e8c'/%3E%3Ctext x='32' y='44' font-size='34' text-anchor='middle' fill='%23f7f8f8' font-family='serif'%3E拾%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <a class="skip-link" href="#app">跳到内容</a>

  <header class="site-header">
    <div class="wrap header-inner">
      <a class="wordmark" href="#/home" id="siteTitle">拾遗录</a>
      <nav class="nav" aria-label="主导航">
        <a href="#/home">首页</a>
        <a href="#/archive">归档</a>
        <a href="#/about">关于</a>
        <a href="#/search">搜索</a>
        <button type="button" id="themeToggle" class="nav-btn" aria-label="切换深浅色模式" title="切换深浅色模式">昼/夜</button>
        <a href="#/admin" class="nav-admin">管理</a>
      </nav>
    </div>
  </header>

  <main id="app" tabindex="-1"></main>

  <footer class="site-footer">
    <div class="wrap footer-inner">
      <span id="footerLeft">拾遗录</span>
      <span id="footerRight"></span>
    </div>
  </footer>

  <div id="searchOverlay" class="overlay" hidden>
    <div class="overlay-panel">
      <div class="overlay-head">
        <input id="searchInput" type="search" placeholder="输入关键词，搜索标题、标签与正文…" autocomplete="off" aria-label="搜索文章" />
        <button type="button" id="searchClose" class="icon-btn" aria-label="关闭搜索">×</button>
      </div>
      <div id="searchResults" class="search-results"></div>
      <p class="search-hint">按 Esc 关闭</p>
    </div>
  </div>

  <div id="lightbox" class="lightbox" hidden>
    <img id="lightboxImg" src="" alt="" />
    <button type="button" id="lightboxClose" class="icon-btn lightbox-close" aria-label="关闭图片">×</button>
  </div>

  <div id="toast" class="toast" role="status" hidden></div>

  <script src="markdown.js"></script>
  <script src="app.js"></script>
  <script src="admin.js"></script>

</html>
